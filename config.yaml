# Multi-Agent Coder — configuration
#
# Strict model list: we only keep models proven to produce working code on
# this hardware. Small (< 14B) models and cloud models have been removed so
# the pipeline never silently falls back to a weak model that produces
# broken output.

servers:
  gpu5070:
    url: "http://192.168.0.224:11434"
    label: "RTX 5070 (12 Go)"
    concurrency: 2
  gpu4060:
    url: "http://192.168.0.203:11434"
    label: "RTX 4060"
    concurrency: 2
  gpu3070:
    url: "http://192.168.0.249:11434"
    label: "RTX 3070"
    concurrency: 2

# Coding-capable models used in the whole pipeline:
#   * qwen2.5-coder:32b   — primary for code + fix work (state-of-the-art
#                           open-source coder as of late 2025, ~20 GB Q4,
#                           small CPU offload on a 12 GB GPU, very usable)
#   * deepseek-coder:33b  — secondary fallback for code + fix
#   * qwen2.5-coder:14b   — lightweight fallback (tight VRAM situations)
#   * deepseek-r1:14b     — reasoning (planner / architect / reviewer / analyst)
# If none of these are reachable, the pipeline fails fast rather than
# silently demoting to a weak model that produces broken output.
roles:
  # Splits the project into atomic tasks, produces the plan.
  planner:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.2
    num_ctx: 16384

  # High-level architecture: file tree, specs, interfaces.
  architect:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.3
    num_ctx: 16384

  # Main code writer.
  coder:
    primary: { server: gpu5070, model: "qwen2.5-coder:32b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
      - { server: gpu4060, model: "qwen2.5-coder:14b" }
    temperature: 0.15
    num_ctx: 16384

  # Reviews code written by the coder (different base model for diversity).
  reviewer:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu4060, model: "qwen2.5-coder:14b" }
    temperature: 0.1
    num_ctx: 16384

  # Analyses test failures / stack traces and proposes a fix plan.
  tester_analyst:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu4060, model: "qwen2.5-coder:14b" }
    temperature: 0.1
    num_ctx: 12288

  # Dedicated fixer: applies the smallest possible patch given an analyst
  # report or an in-loop static-check error. Separated from `coder` so we
  # can use temperature 0 and a stricter prompt — the coder writes new
  # code, the fixer edits existing code without rewriting it.
  fixer:
    primary: { server: gpu5070, model: "qwen2.5-coder:32b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
      - { server: gpu4060, model: "qwen2.5-coder:14b" }
    temperature: 0.0
    num_ctx: 16384

  # Cheap dispatcher / classification tasks.
  # Uses qwen2.5-coder:14b too — we'd rather spend a few extra seconds than
  # let a 1.5B model misclassify.
  dispatcher:
    primary: { server: gpu4060, model: "qwen2.5-coder:14b" }
    fallbacks:
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.0
    num_ctx: 4096

orchestrator:
  # Max number of test/fix iterations per project (-1 = unlimited, bounded
  # only by max_wall_seconds).
  max_iterations: -1
  # Max retries when a file fails review before escalating back to the planner.
  max_review_retries: 5
  # Seconds between heartbeats (used to detect stalled background jobs).
  heartbeat_interval: 30
  # Sandbox type: "docker" (isolated) or "local" (no isolation, dangerous).
  sandbox: "docker"
  # Docker image used for the sandbox.
  sandbox_image: "python:3.12-slim"
  # Hard timeout for a single test run inside the sandbox (seconds).
  sandbox_timeout: 600
  # How many coder tasks may run concurrently. 1 = sequential (safest, one
  # strong model gets full VRAM). Bump to 2 if you want to trade a bit of
  # quality for parallelism.
  parallel_coders: 1
  # Absolute wall-clock budget per project, in seconds. -1 = unlimited.
  # Typical values: 3600 = 1h, 86400 = 1 day, 604800 = 1 week.
  max_wall_seconds: -1
