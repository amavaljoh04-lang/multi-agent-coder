# Multi-Agent Coder — configuration
#
# This file wires the 3 Ollama servers to the roles used by the orchestrator.
# Each role has a primary pick and a list of fallbacks that will be tried in
# order if the primary server is down, overloaded, or returns errors.
#
# Server URLs are plain HTTP Ollama endpoints (the default port is 11434).

servers:
  gpu5070:
    url: "http://192.168.0.224:11434"
    label: "RTX 5070 (12 Go)"
    concurrency: 2
  gpu4060:
    url: "http://192.168.0.203:11434"
    label: "RTX 4060"
    concurrency: 2
  gpu3070:
    url: "http://192.168.0.249:11434"
    label: "RTX 3070"
    concurrency: 2

roles:
  # Splits the project into atomic tasks, produces the plan.
  planner:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "glm-5.1:cloud" }
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.2
    num_ctx: 16384

  # Produces the high level architecture (file tree, specs, interfaces).
  architect:
    primary: { server: gpu5070, model: "kimi-k2.5:cloud" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-r1:14b" }
      - { server: gpu5070, model: "glm-5.1:cloud" }
    temperature: 0.3
    num_ctx: 32768

  # Main code writer.
  coder:
    primary: { server: gpu5070, model: "qwen2.5-coder:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu4060, model: "qwen2.5-coder:7b" }
    temperature: 0.15
    num_ctx: 16384

  # Parallel coder for independent files, runs on a second server.
  coder_parallel:
    primary: { server: gpu4060, model: "qwen2.5-coder:7b" }
    fallbacks:
      - { server: gpu3070, model: "deepseek-coder:6.7b" }
      - { server: gpu5070, model: "qwen2.5-coder:7b" }
    temperature: 0.15
    num_ctx: 12288

  # Language-specialised coders. The orchestrator picks one of these
  # based on the file extensions in the task (fallback to `coder` when
  # the language is mixed or unknown). Having a dedicated model per
  # language means we stop trying to coax a Python model into writing
  # idiomatic Rust, and vice versa.
  coder_py:
    primary: { server: gpu5070, model: "deepseek-coder:33b" }
    fallbacks:
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
      - { server: gpu4060, model: "qwen2.5-coder:7b" }
    temperature: 0.1
    num_ctx: 16384
  coder_web:
    primary: { server: gpu5070, model: "qwen2.5-coder:14b" }
    fallbacks:
      - { server: gpu4060, model: "qwen2.5-coder:7b" }
      - { server: gpu5070, model: "deepseek-coder:33b" }
    temperature: 0.15
    num_ctx: 16384
  coder_rust:
    primary: { server: gpu5070, model: "deepseek-coder:33b" }
    fallbacks:
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.1
    num_ctx: 16384
  coder_go:
    primary: { server: gpu5070, model: "deepseek-coder:33b" }
    fallbacks:
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
    temperature: 0.1
    num_ctx: 16384

  # Reviews code written by the coder (different base model for diversity).
  reviewer:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu4060, model: "qwen2.5:7b-instruct-q4_K_M" }
      - { server: gpu5070, model: "deepseek-coder:33b" }
    temperature: 0.1
    num_ctx: 16384

  # Analyses test failures / stack traces and proposes a fix plan.
  # NOTE: this role needs strong reasoning on tracebacks, so we use a 14B
  # reasoning model instead of the old gemma4 (too weak, kept flipping imports).
  tester_analyst:
    primary: { server: gpu5070, model: "deepseek-r1:14b" }
    fallbacks:
      - { server: gpu5070, model: "deepseek-coder:33b" }
      - { server: gpu4060, model: "qwen2.5-coder:14b" }
      - { server: gpu3070, model: "gemma4:latest" }
    temperature: 0.1
    num_ctx: 12288

  # Dedicated fixer: applies the smallest possible patch given an analyst
  # report and the current file tree. Separated from `coder` so we can use a
  # lower temperature and a much stricter prompt — the coder writes new code
  # from a spec, the fixer edits existing code without rewriting it.
  fixer:
    primary: { server: gpu5070, model: "deepseek-coder:33b" }
    fallbacks:
      - { server: gpu5070, model: "qwen2.5-coder:14b" }
      - { server: gpu4060, model: "qwen2.5-coder:7b" }
    temperature: 0.0
    num_ctx: 16384

  # Cheap dispatcher / classification tasks.
  dispatcher:
    primary: { server: gpu3070, model: "qwen2.5-coder:1.5b" }
    fallbacks:
      - { server: gpu3070, model: "gemma4:latest" }
    temperature: 0.0
    num_ctx: 4096

orchestrator:
  # Max number of test/fix iterations per project (-1 = infinite, runs for
  # weeks if needed — the user explicitly asked for this).
  max_iterations: -1
  # Max retries when a file fails review before escalating back to the planner.
  max_review_retries: 5
  # Seconds between heartbeats (used to detect stalled background jobs).
  heartbeat_interval: 30
  # Sandbox type: "docker" (isolated) or "local" (no isolation, dangerous).
  sandbox: "docker"
  # Docker image used for the sandbox.
  sandbox_image: "python:3.12-slim"
  # Hard timeout for a single test run inside the sandbox (seconds).
  sandbox_timeout: 600
  # How many coder tasks may run concurrently (each on a different GPU).
  # With 3 Ollama servers, 2-3 is the sweet spot.
  parallel_coders: 2
  # Absolute wall-clock budget per project, in seconds. -1 = unlimited.
  # Typical values: 3600 = 1h, 86400 = 1 day, 604800 = 1 week.
  max_wall_seconds: -1
