[project]
name = "multi-agent-coder"
version = "0.1.0"
description = "Multi-agent AI coding orchestrator across 3 Ollama servers"
requires-python = ">=3.11"
readme = "../README.md"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/agents/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
