<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M·A·C — neural swarm</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap"
    />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 44" width="28" height="32" aria-hidden="true">
          <polygon points="20,2 37,12 37,32 20,42 3,32 3,12" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="20" cy="22" r="3" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <span class="brand-title">M·A·C</span>
          <span class="brand-sub">neural swarm</span>
        </div>
      </div>
      <div id="servers" class="servers"></div>
      <button id="btn-menu" class="btn-menu" aria-label="menu">☰</button>
    </header>

    <main class="shell">
      <aside class="sidebar" id="sidebar">
        <section class="card">
          <header class="card-head">New directive</header>
          <form id="new-project" class="form">
            <input id="proj-name" type="text" placeholder="designation (ex. url-shortener)" required />
            <textarea id="proj-prompt" rows="7" placeholder="Mission briefing : stack, endpoints, tests, contraintes…" required></textarea>
            <button type="submit" class="btn primary">Deploy swarm</button>
          </form>
        </section>

        <section class="card">
          <header class="card-head">
            <span>Missions</span>
            <span id="projects-count" class="chip">0</span>
          </header>
          <ul id="projects" class="projects"></ul>
        </section>
      </aside>

      <section class="stage">
        <!-- empty state (idle) -->
        <div id="empty-state" class="empty-state">
          <canvas id="idle-graph" class="idle-graph"></canvas>
          <div class="idle-overlay">
            <div class="idle-line">awaiting directive</div>
            <h1>NEURAL SWARM</h1>
            <p>Six agents autonomes. Trois GPU. Boucle d'auto-correction illimitée.</p>
          </div>
        </div>

        <!-- active project -->
        <div id="project-view" class="project-view hidden">
          <header class="proj-head">
            <div class="proj-meta">
              <h2 id="proj-title">—</h2>
              <span id="proj-status" class="status-pill">—</span>
            </div>
            <div class="proj-actions">
              <button id="btn-pause" class="btn-icon" title="Pause">❚❚</button>
              <button id="btn-resume" class="btn-icon" title="Reprendre">▶</button>
              <a id="btn-zip" class="btn-icon zip hidden" href="#" download title="Télécharger ZIP">⬇</a>
              <button id="btn-delete" class="btn-icon danger" title="Supprimer">✕</button>
            </div>
          </header>

          <!-- neural graph canvas -->
          <div class="graph-wrap">
            <canvas id="graph" class="graph"></canvas>
            <div id="graph-overlay" class="graph-overlay">
              <div id="current-action" class="current-action">—</div>
              <div id="graph-legend" class="graph-legend"></div>
            </div>
          </div>

          <!-- tasks strip + events + files as collapsible drawers -->
          <nav class="drawers">
            <button class="drawer-tab active" data-tab="tasks">Tasks<span id="tasks-count" class="chip">0</span></button>
            <button class="drawer-tab" data-tab="events">Events<span id="events-count" class="chip">0</span></button>
            <button class="drawer-tab" data-tab="files">Artifacts<span id="files-count" class="chip">0</span></button>
          </nav>

          <div class="drawer-body">
            <div id="pane-tasks" class="pane active">
              <ul id="tasks" class="tasks"></ul>
            </div>
            <div id="pane-events" class="pane">
              <div id="logs" class="logs"></div>
            </div>
            <div id="pane-files" class="pane">
              <ul id="files" class="files"></ul>
              <pre id="file-preview" class="file-preview"></pre>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
